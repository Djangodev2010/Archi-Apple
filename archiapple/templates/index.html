{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topics | ArchiApple</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicon/devicon@v2.15.1/devicon.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js" integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf" crossorigin="anonymous"></script>

    <style>
      body {
        background-color: #f8f9fa;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      
      .backdrop-blur {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      /* Modern Card Hover Effects */
      .topic-card {
        border: none;
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        background: #ffffff;
      }
      
      .topic-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08) !important;
      }
      
      /* Logo / Icon Box Styling */
      .topic-logo-box {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f1f5f9;
        overflow: hidden;
        flex-shrink: 0;
      }
      
      .topic-logo-img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      
      /* Soft Badge Tags */
      .badge-soft {
        font-size: 0.75rem;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: 500;
        background-color: #f8f9fa;
        color: #495057;
        border: 1px solid #e9ecef;
      }
    </style>
  </head>
  <body>
    <!-- Modern Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom bg-white bg-opacity-75 backdrop-blur">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark fs-5" href="#">
          <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-2" style="width: 36px; height: 36px;"><i class="bi bi-layers-fill fs-6"></i></span>
          <span>Archi<span class="text-primary">Apple</span></span>
        </a>

        <button class="navbar-toggler border-0 shadow-none p-2" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation"><i class="bi bi-list fs-2 text-dark"></i></button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
            <li class="nav-item">
              <a class="nav-link active px-3" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" href="#">Explore Topics</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle px-3" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Resources</a>
              <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg rounded-3 mt-2 p-2">
                <li>
                  <a class="dropdown-item rounded-2 py-2" href="#"><i class="bi bi-book me-2 text-primary"></i> Documentation</a>
                </li>
                <li>
                  <a class="dropdown-item rounded-2 py-2" href="#"><i class="bi bi-code-square me-2 text-success"></i> Code Samples</a>
                </li>
                <li>
                  <hr class="dropdown-divider" />
                </li>
                <li>
                  <a class="dropdown-item rounded-2 py-2" href="#"><i class="bi bi-people me-2 text-warning"></i> Community Forum</a>
                </li>
              </ul>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
            <form class="position-relative me-2" role="search" hx-get="{% url 'search_topics' %}" hx-trigger="input changed deplay:500ms" hx-target="#topic-container" hx-swap="innerHTML">
              <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
              <input class="form-control rounded-pill ps-5 bg-light border-0" name="query" type="search" placeholder="Search topics..." aria-label="Search" style="width: 220px;" />
            </form>
            <a href="#" class="btn btn-light rounded-pill px-3 fw-semibold text-dark">Log In</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Section Header -->
    <div class="container py-5">
      <div class="row mb-4 align-items-end">
        <div class="col-md-8">
          <h2 class="fw-bold text-dark display-6 mb-1">Browse Topics</h2>
          <p class="text-muted mb-0">All the free resources that you need, at your fingertips!</p>
        </div>
      </div>

      <!-- Topics Grid -->
      {% include 'partials/topics.html' %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  </body>
</html>
